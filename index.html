
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IdeiaLab AI | Seu conteúdo começa aqui</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #f5f7ff;
    }
    header {
      padding: 24px 8%;
      border-bottom: 1px solid #252c40;
      font-weight: bold;
      font-size: 22px;
    }
    header span { color: #a78bfa; }
    main {
      max-width: 760px;
      margin: 60px auto;
      padding: 0 22px;
    }
    .tag {
      color: #c4b5fd;
      font-size: 13px;
      letter-spacing: 2px;
    }
    h1 { font-size: clamp(34px, 7vw, 54px); margin-bottom: 12px; }
    h1 span { color: #a78bfa; }
    .intro { color: #b8c0d8; line-height: 1.7; }
    .panel {
      background: #151c30;
      border: 1px solid #303953;
      padding: 25px;
      border-radius: 18px;
      margin-top: 30px;
    }
    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }
    input, select, button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
    }
    input, select {
      color: white;
      background: #0b1020;
      border: 1px solid #3a4562;
    }
    button {
      margin-top: 22px;
      background: #8b5cf6;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #7c3aed; }
    #resultado {
      display: none;
      margin-top: 22px;
      padding: 20px;
      background: #0b1020;
      border-radius: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    #copiar { background: #29334d; }
    footer {
      text-align: center;
      color: #9ba6c2;
      padding: 30px 15px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>IdeiaLab <span>AI ✦</span></header>

  <main>
    <div class="tag">SEU ESTÚDIO DE CONTEÚDO</div>
    <h1>Ideias que viram <span>conteúdo.</span></h1>
    <p class="intro">
      Crie ideias, legendas e chamadas para suas redes sociais.
      Escolha o tema e gere seu primeiro conteúdo em segundos.
    </p>

    <section class="panel">
      <h2>✨ Gerador de conteúdo</h2>

      <label for="tema">Qual é o tema do seu conteúdo?</label>
      <input id="tema" placeholder="Ex.: ganhar dinheiro pela internet">

      <label for="rede">Onde você vai publicar?</label>
      <select id="rede">
        <option>Instagram</option>
        <option>TikTok</option>
        <option>YouTube</option>
      </select>

      <label for="tipo">O que você quer criar?</label>
      <select id="tipo">
        <option value="legenda">Legenda para publicação</option>
        <option value="video">Roteiro de vídeo curto</option>
        <option value="ideia">Ideias de conteúdo</option>
      </select>

      <button onclick="gerar()">✨ Gerar meu conteúdo</button>

      <div id="resultado"></div>
      <button id="copiar" onclick="copiar()" style="display:none">
        Copiar conteúdo
      </button>
    </section>
  </main>

  <footer>IdeiaLab AI · Seu próximo conteúdo começa aqui.</footer>

  <script>
 async function gerar() {
  const tema = document.getElementById("tema").value.trim();
  const rede = document.getElementById("rede").value;
  const tipo = document.getElementById("tipo").value;
  const resultado = document.getElementById("resultado");
  const copiarBtn = document.getElementById("copiar");

  if (!tema) {
    alert("Digite um tema antes de continuar!");
    return;
  }

  resultado.textContent = "✨ Gerando seu conteúdo...";
  resultado.style.display = "block";
  copiarBtn.style.display = "none";

  try {
    const resposta = await fetch("https://ideialab-api.luizggustavo1.workers.dev", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        tema: tema,
        rede: rede,
        tipo: tipo
      })
    });

    const dados = await resposta.json();

    if (!resposta.ok) {
      throw new Error(dados.error || "Erro ao gerar conteúdo.");
    }

    resultado.textContent = dados.texto;
    copiarBtn.style.display = "block";

  } catch (erro) {
    console.error(erro);
    resultado.textContent = "❌ Não foi possível gerar o conteúdo. Tente novamente.";
    alert("Erro ao conectar com a API.");
  }
}

    function copiar() {
      const texto = document.getElementById("resultado").textContent;
      navigator.clipboard.writeText(texto)
        .then(() => alert("Conteúdo copiado!"))
        .catch(() => alert("Selecione e copie o texto manualmente."));
    }
  </script>
</body>
</html>
